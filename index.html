<!doctype html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="gViy4nvnbBsXhAUFtQbUZysZuNDtAmiTJnueeSUr3JQ" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeniton Augustinpillai - Nanotechnology Engineering</title>
    <meta name="description" content="Nanotechnology Engineering student passionate about advancing the semiconductor industry through innovative microfabrication and nanoscale device development." />
    <meta name="author" content="Jeniton Augustinpillai" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only weights the site actually sets: Inter 400-700 (body), mono 400/500 (labels),
         Grotesk 500-700 (display), Playfair italic 400 (accent), Dancing Script 700 (monogram) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:ital,wght@1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <!-- Favicon (512x512 — also what Google Search shows beside the URL) -->
    <link rel="icon" type="image/png" sizes="512x512" href="/WebsiteLogo.png" />
    <link rel="shortcut icon" type="image/png" href="/WebsiteLogo.png" />
    <link rel="apple-touch-icon" href="/WebsiteLogo.png" />

    <!-- Site name for Google Search (otherwise it guesses "Vercel" from the domain) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Jeniton Augustinpillai",
      "alternateName": "Jeniton Augustinpillai Portfolio",
      "url": "https://jeniton.vercel.app/"
    }
    </script>

    <!-- Open Graph — read by Facebook, LinkedIn, Discord, Slack, WhatsApp, iMessage.
         One tag set only: duplicate og: tags make scrapers pick values at random.
         Image is 600x315 (exact 1.91:1 card ratio, no cropping anywhere);
         the ?v=2 busts scraper caches that still hold the previous image. -->
    <meta property="og:title" content="Jeniton Augustinpillai - Nanotechnology Engineering" />
    <meta property="og:description" content="Nanotechnology Engineering student specializing in semiconductor physics, microfabrication, and nanoscale device development." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jeniton.vercel.app/" />
    <meta property="og:image" content="https://jeniton.vercel.app/OGImage.png?v=2" />
    <meta property="og:image:secure_url" content="https://jeniton.vercel.app/OGImage.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="315" />
    <meta property="og:image:alt" content="Jeniton Augustinpillai - Nanotechnology Engineering Portfolio" />
    <meta property="og:site_name" content="Jeniton Augustinpillai Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jeniton Augustinpillai - Nanotechnology Engineering" />
    <meta name="twitter:description" content="Nanotechnology Engineering student specializing in semiconductor physics, microfabrication, and nanoscale device development." />
    <meta name="twitter:image" content="https://jeniton.vercel.app/OGImage.png?v=2" />
    <meta name="twitter:image:alt" content="Jeniton Augustinpillai - Nanotechnology Engineering Portfolio" />

    <meta name="theme-color" content="#E8A33D" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
